<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritmo Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #14122b; color: #f2f0ff; font-family: 'Bricolage Grotesque', sans-serif; }
    .card { background-color: #1f1c42; border-radius: 24px; padding: 20px; margin-bottom: 16px; }
    .btn { width: 100%; background-color: #8b7bff; color: white; font-weight: 600; padding: 12px; border-radius: 16px; text-align: center; display: block; margin-top: 10px; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">
  <div class="card text-center">
    <h1 class="text-2xl font-bold text-[#8b7bff] mb-2">Ritmo Pro</h1>
    <p class="text-sm text-[#a9a4d6] mb-4">Seu acompanhamento de treinos, nutrição e exames.</p>
    <div class="p-4 bg-[#14122b] rounded-2xl mb-4 border border-[#322e63]">
      <p class="font-semibold text-lg">Selecione Músculos no Corpo</p>
      <p class="text-xs text-[#a9a4d6] mt-1">Peito, Costas, Ombros, Quadríceps, Bíceps, Tríceps</p>
    </div>
    <button class="btn" onclick="alert('Ritmo Pro ativo!')">Iniciar Acompanhamento</button>
  </div>
</body>
</html>
